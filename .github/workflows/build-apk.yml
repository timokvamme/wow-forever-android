name: Build APK

# Pushing a version tag (git push origin v2.2.5) builds a signed APK, creates the GitHub release
# if needed and attaches the APK, where the in-app updater (AppUpdater.kt) finds it. Publishing
# a release from the GitHub UI does the same. "Run workflow" on the Actions tab on main releases
# the current versionName as v<versionName>; on any other branch it only uploads an artifact.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the keystore file, base64 encoded (base64 -w0 my.jks)
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          optional, defaults to "wowforever"
#   KEY_PASSWORD       optional, defaults to KEYSTORE_PASSWORD
# The key must be the one the installed app was signed with, or Android refuses the update.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.event.release.tag_name || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Cache runtime components
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/bundled_components
          key: components-${{ hashFiles('tools/components.sha256', 'tools/fetch_components.sh') }}

      - name: Fetch Wine, DXVK and Turnip components
        run: tools/fetch_components.sh

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          KEY_ALIAS="${KEY_ALIAS:-wowforever}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build release APK
        run: ./gradlew --no-daemon assembleModernRelease

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          out="WoW-Forever-$version.apk"
          cp app/build/outputs/apk/modern/release/app-modern-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Create the release and attach the APK
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}', steps.apk.outputs.version) }}
        run: |
          if ! gh release view "$TAG" -R "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "$TAG" -R "${{ github.repository }}" --target "$GITHUB_SHA" --title "WoW Forever $TAG" --notes "Built by GitHub Actions from $TAG."
          fi
          gh release upload "$TAG" "${{ steps.apk.outputs.file }}" --clobber -R "${{ github.repository }}"

      - name: Remove signing key
        if: always()
        run: rm -rf app/keystores
